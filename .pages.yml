# Editing dashboard for Pages CMS (https://app.pagescms.org)
# Log in with GitHub, pick this repository, and edit everything below without touching code.

media:
  input: media
  output: /media

content:
  - name: films
    label: Films
    type: file
    path: content/films.json
    format: json
    fields:
      - name: films
        label: Films (drag to reorder)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - name: category
            label: Section
            type: select
            options:
              values: [wedding, commercial]
          - { name: featured, label: "Show as the big featured film (tick only one)", type: boolean }
          - { name: video, label: "Video file (MP4, under 20MB)", type: file, required: true }
          - { name: poster, label: Cover image, type: image, required: true }
          - { name: description, label: "Short description (for Google video results)", type: text }
          - { name: duration_seconds, label: "Length in seconds (e.g. 240)", type: number }
          - { name: date_added, label: Date added, type: date }

  - name: photos
    label: Photos
    type: file
    path: content/photos.json
    format: json
    fields:
      - name: photos
        label: Photos (drag to reorder)
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: "Short description (for Google and screen readers)", type: string, required: true }
          - name: category
            label: Section
            type: select
            options:
              values: [wedding, commercial]
          - name: size
            label: Size in the grid
            type: select
            options:
              values: [normal, tall, wide, full]

  - name: reviews
    label: Reviews
    type: file
    path: content/reviews.json
    format: json
    fields:
      - name: reviews
        label: Reviews (shown under the big quote)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: text, label: Review, type: text, required: true }
          - name: category
            label: Shown on
            type: select
            options:
              values: [wedding, commercial]

  - name: faq
    label: FAQ
    type: file
    path: content/faq.json
    format: json
    fields:
      - { name: title, label: Section heading, type: string }
      - name: faqs
        label: Questions (drag to reorder)
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string, required: true }
          - { name: answer, label: Answer, type: text, required: true }

  - name: pages
    label: Service pages
    type: collection
    path: content/pages
    format: json
    fields:
      - { name: slug, label: "Web address (e.g. wedding-videographer-derbyshire)", type: string, required: true }
      - { name: nav_label, label: Short name (used in links), type: string }
      - { name: seo_title, label: "Page title in Google (under 60 characters)", type: string }
      - { name: seo_description, label: "Description in Google (under 155 characters)", type: text }
      - { name: eyebrow, label: Small label above the heading, type: string }
      - { name: h1, label: Main heading, type: string }
      - { name: hero_image, label: Top image, type: image }
      - { name: hero_alt, label: Top image description, type: string }
      - { name: intro, label: Intro paragraphs, type: text, list: true }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - name: film_category
        label: Films to show
        type: select
        options:
          values: ["", wedding, commercial]
      - name: photo_category
        label: Photos to show
        type: select
        options:
          values: ["", wedding, commercial]
      - { name: photo_limit, label: Number of photos, type: number }
      - { name: show_pricing, label: Show wedding prices, type: boolean }
      - name: faqs
        label: Questions on this page
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

  - name: site
    label: Page text & prices
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero
        label: Top of the page
        type: object
        fields:
          - { name: tagline, label: Line under the logo, type: string }
          - { name: reel, label: "Background reel (short silent MP4, under 10MB)", type: file }
          - { name: reel_poster, label: Still shown while the reel loads, type: image }
          - { name: reel_mobile, label: "Smaller reel for phones (MP4, under 3MB)", type: file }
          - { name: button_text, label: Button text, type: string }
      - name: weddings
        label: Weddings section
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image }
          - { name: image_alt, label: Image description, type: string }
          - { name: link_text, label: Link text, type: string }
          - { name: venues, label: "Venues line (optional)", type: string }
      - name: commercial
        label: Commercial section
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image }
          - { name: image_alt, label: Image description, type: string }
          - { name: link_text, label: Link text, type: string }
      - name: about
        label: About us
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: title_emphasis, label: "Heading (brown italic part)", type: string }
          - { name: image, label: Photo, type: image }
          - { name: image_alt, label: Photo description, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
      - name: reviews
        label: Big review quote
        type: object
        fields:
          - { name: rating_text, label: Rating line, type: string }
          - { name: featured_quote, label: Quote, type: text }
          - { name: featured_name, label: Name, type: string }
      - name: booking
        label: How booking works
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step heading, type: string }
              - { name: text, label: Step text, type: text }
      - name: pricing
        label: Pricing
        type: object
        fields:
          - { name: intro, label: Intro text, type: text }
          - name: packages
            label: Wedding packages
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: price, label: "Price (e.g. £750)", type: string }
              - { name: badge, label: "Small label (optional, e.g. Save £200)", type: string }
              - { name: description, label: Description, type: text }
              - { name: highlight, label: Dark highlighted card, type: boolean }
          - { name: button_text, label: Package link text, type: string }
          - { name: commercial_title, label: Commercial box heading, type: string }
          - { name: commercial_text, label: Commercial box text, type: text }
          - { name: commercial_button, label: Commercial box button, type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: title_emphasis, label: "Heading (italic part)", type: string }
          - { name: phone, label: Phone, type: string }
          - { name: email, label: Email, type: string }
          - { name: area, label: Area line, type: string }
          - { name: town, label: "Town you are based in (for Google)", type: string }
          - { name: areas, label: "Areas covered (footer line)", type: string }
          - { name: enquiry_types, label: Enquiry form options, type: string, list: true }
          - { name: thank_you, label: Message after sending the form, type: text }
      - name: social
        label: Social links
        type: object
        fields:
          - { name: facebook, label: Facebook page link, type: string }
          - { name: instagram, label: "Instagram link (leave empty to hide)", type: string }
          - { name: google_business, label: "Google Business Profile link (leave empty to hide)", type: string }
      - name: seo
        label: Google & sharing
        type: object
        fields:
          - { name: title, label: Page title in Google, type: string }
          - { name: description, label: Description in Google, type: text }
          - { name: share_image, label: Image when the link is shared, type: image }
